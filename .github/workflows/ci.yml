name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # The package requires the macOS 26 SDK (Package.swift: .macOS(.v26),
    # swift-tools-version 6.2). macos-latest still maps to macOS 15, so pin
    # the macOS 26 image explicitly; its default Xcode is 26.x.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        run: swift build

      # Deterministic gate: exclude tests that make real Wikipedia requests so a rate limit or
      # network outage cannot mask whether MacWiki's own behavior is sound.
      - name: Test (no network)
        run: swift test
        env:
          MACWIKI_SKIP_NETWORK_TESTS: "1"

      # Advisory integration pass against Wikipedia's live API. Upstream availability and response
      # changes remain visible without blocking an otherwise healthy build.
      - name: Test (live Wikipedia integration)
        continue-on-error: true
        run: swift test

      - name: Maintainability Check (Advisory)
        continue-on-error: true
        run: ./scripts/check_maintainability.sh

      - name: Build (Release)
        run: swift build -c release
