name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (Debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build (Release)
        run: swift build -c release
