name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # The package requires the macOS 26 SDK (Package.swift: .macOS(.v26),
    # swift-tools-version 6.2). macos-latest still maps to macOS 15, so pin
    # the macOS 26 image explicitly; its default Xcode is 26.x.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build (Debug)
        run: swift build

      # These suites cover macOS 27 AppKit behavior or SwiftData failure rollback semantics that
      # differ in Xcode 26. They remain part of the full local Xcode 27 test run; the public runner
      # executes every other suite on its clean Xcode 26 image.
      - name: Test (Xcode 26 compatible, no network)
        run: >-
          swift test
          --skip 'LibraryResetServiceTests|HighlightPersistenceTests|WebViewHighlightRehydrateTests|ReaderStateTests|QAProcessSafetyShellTests|ReaderScrollBehaviorRegressionTests|NativeWorkspaceLayoutTests'
        env:
          MACWIKI_SKIP_NETWORK_TESTS: "1"

      # Advisory integration pass against Wikipedia's live API. Upstream availability and response
      # changes remain visible without blocking an otherwise healthy build.
      - name: Test (live Wikipedia integration)
        continue-on-error: true
        run: >-
          swift test
          --skip 'LibraryResetServiceTests|HighlightPersistenceTests|WebViewHighlightRehydrateTests|ReaderStateTests|QAProcessSafetyShellTests|ReaderScrollBehaviorRegressionTests|NativeWorkspaceLayoutTests'

      - name: Maintainability Check (Advisory)
        continue-on-error: true
        run: ./scripts/check_maintainability.sh

      - name: Build (Release)
        run: swift build -c release
